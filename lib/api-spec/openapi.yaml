openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: apk
    description: APK rebranding operations
  - name: stripe
    description: Stripe payment operations
  - name: customer
    description: Customer operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /apk/upload:
    post:
      operationId: uploadApk
      tags: [apk]
      summary: Upload an APK file
      description: Uploads an APK and starts decompilation automatically
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                apk:
                  type: string
                  format: binary
              required:
                - apk
      responses:
        "200":
          description: APK uploaded and decompilation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apk/{sessionId}/status:
    get:
      operationId: getSessionStatus
      tags: [apk]
      summary: Get session status
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"

  /apk/{sessionId}/info:
    get:
      operationId: getApkInfo
      tags: [apk]
      summary: Get decompiled APK info
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: APK info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApkInfo"

  /apk/{sessionId}/name:
    put:
      operationId: updateAppName
      tags: [apk]
      summary: Update app name
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNameBody"
      responses:
        "200":
          description: Name updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /apk/{sessionId}/url:
    put:
      operationId: updatePanelUrl
      tags: [apk]
      summary: Update panel URL
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUrlBody"
      responses:
        "200":
          description: URL updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrlUpdateResult"

  /apk/{sessionId}/url/search:
    post:
      operationId: searchKeyword
      tags: [apk]
      summary: Search for a keyword across decompiled files
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordSearchBody"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordSearchResult"

  /apk/{sessionId}/url/replace:
    put:
      operationId: batchReplace
      tags: [apk]
      summary: Batch replace occurrences across decompiled files
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchReplaceBody"
      responses:
        "200":
          description: Replacements applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchReplaceResult"

  /apk/{sessionId}/images:
    get:
      operationId: listImages
      tags: [apk]
      summary: List all images in the APK
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageList"

  /apk/{sessionId}/image:
    get:
      operationId: getImage
      tags: [apk]
      summary: Get a specific image file
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image file
          content:
            image/*:
              schema:
                type: string
                format: binary

  /apk/{sessionId}/image/replace:
    post:
      operationId: replaceImage
      tags: [apk]
      summary: Replace an image in the APK
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                targetPath:
                  type: string
              required:
                - image
                - targetPath
      responses:
        "200":
          description: Image replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /apk/{sessionId}/recompile:
    post:
      operationId: recompileApk
      tags: [apk]
      summary: Recompile the modified APK
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recompilation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /apk/{sessionId}/download:
    get:
      operationId: downloadApk
      tags: [apk]
      summary: Download the recompiled APK
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: APK file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /stripe/create-checkout-session:
    post:
      operationId: createCheckoutSession
      tags: [stripe]
      summary: Create a Stripe Checkout session for purchasing credits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                creditPackId:
                  type: integer
              required:
                - creditPackId
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        "400":
          description: Invalid pack or inactive
        "401":
          description: Not authenticated

  /stripe/checkout-success:
    get:
      operationId: checkoutSuccess
      tags: [stripe]
      summary: Verify a Stripe Checkout session payment status
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
        "403":
          description: Not authorized

  /customer/credit-packs:
    get:
      operationId: getCustomerCreditPacks
      tags: [customer]
      summary: List available credit packs for purchase
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of active credit packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPack"

  /customer/purchase-history:
    get:
      operationId: getCustomerPurchaseHistory
      tags: [customer]
      summary: Get current user's credit transaction history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of credit transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditTransaction"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    SessionInfo:
      type: object
      properties:
        sessionId:
          type: string
        status:
          type: string
        fileName:
          type: string
      required:
        - sessionId
        - status
        - fileName

    SessionStatus:
      type: object
      properties:
        sessionId:
          type: string
        status:
          type: string
          enum: [uploading, decompiling, ready, recompiling, done, error]
        error:
          type: string
        progress:
          type: string
      required:
        - sessionId
        - status

    ApkInfo:
      type: object
      properties:
        appName:
          type: string
        packageName:
          type: string
        versionName:
          type: string
        versionCode:
          type: string
        urls:
          type: array
          items:
            type: string
        imageCount:
          type: integer
      required:
        - appName
        - packageName
        - urls
        - imageCount

    UpdateNameBody:
      type: object
      properties:
        newName:
          type: string
      required:
        - newName

    UpdateUrlBody:
      type: object
      properties:
        oldUrl:
          type: string
        newUrl:
          type: string
      required:
        - oldUrl
        - newUrl

    UrlUpdateResult:
      type: object
      properties:
        success:
          type: boolean
        replacements:
          type: integer
      required:
        - success
        - replacements

    KeywordSearchBody:
      type: object
      properties:
        keyword:
          type: string
      required:
        - keyword

    KeywordOccurrence:
      type: object
      properties:
        file:
          type: string
        lineNumber:
          type: integer
        columnStart:
          type: integer
        lineContent:
          type: string
        matchedText:
          type: string
      required:
        - file
        - lineNumber
        - columnStart
        - lineContent
        - matchedText

    KeywordSearchResult:
      type: object
      properties:
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/KeywordOccurrence"
        total:
          type: integer
      required:
        - occurrences
        - total

    BatchReplaceEntry:
      type: object
      properties:
        file:
          type: string
        lineNumber:
          type: integer
        columnStart:
          type: integer
        oldText:
          type: string
        newText:
          type: string
      required:
        - file
        - lineNumber
        - columnStart
        - oldText
        - newText

    BatchReplaceBody:
      type: object
      properties:
        replacements:
          type: array
          items:
            $ref: "#/components/schemas/BatchReplaceEntry"
      required:
        - replacements

    BatchReplaceResult:
      type: object
      properties:
        success:
          type: boolean
        applied:
          type: integer
        perFile:
          type: object
          additionalProperties:
            type: integer
      required:
        - success
        - applied
        - perFile

    ImageInfo:
      type: object
      properties:
        path:
          type: string
        name:
          type: string
        directory:
          type: string
        size:
          type: integer
        type:
          type: string
          enum: [png, jpg, xml, webp, other]
        width:
          type: integer
        height:
          type: integer
        thumbnail:
          type: string
          description: Base64 data URL thumbnail of the image
      required:
        - path
        - name
        - directory
        - size
        - type

    ImageList:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageInfo"
        total:
          type: integer
      required:
        - images
        - total

    CreditPack:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        credits:
          type: integer
        priceCents:
          type: integer
        isActive:
          type: boolean
      required:
        - id
        - name
        - credits
        - priceCents
        - isActive

    CreditTransaction:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: integer
        type:
          type: string
        description:
          type: string
          nullable: true
        stripeSessionId:
          type: string
          nullable: true
        creditPackId:
          type: integer
          nullable: true
        amountPaidCents:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        packName:
          type: string
          nullable: true
        packCredits:
          type: integer
          nullable: true
        packPriceCents:
          type: integer
          nullable: true
      required:
        - id
        - amount
        - type
        - createdAt
